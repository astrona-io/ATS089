# Configure Realm Login, Email And Languages
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-089-lab-050-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-089-lab-050-01-setup"
      description: "Creates the realm inventory with the user alice and the client inventory-web; every setting the task asks for stays at its default"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-login-options"
      description: "Confirms registration, forgotten password and remember me are on, duplicate emails are off and verifyEmail is off"
      type: "file"
      source: "validation/validate-login-options.sh"
    - name: "validate-smtp-server"
      description: "Confirms the realm has the SMTP server from the task without authentication"
      type: "file"
      source: "validation/validate-smtp-server.sh"
    - name: "validate-languages"
      description: "Confirms internationalization with en and da, default en, and the display name"
      type: "file"
      source: "validation/validate-languages.sh"
    - name: "validate-sign-in-page"
      description: "Confirms the sign-in page links to registration and forgotten password"
      type: "file"
      source: "validation/validate-sign-in-page.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
