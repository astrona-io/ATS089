# Fix A Realm That Locks Users Out
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-089-capstone-050"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-089-capstone-050-setup"
      description: "Creates the realm inventory with alice, bob (disabled), the client inventory-cli, two login options off, short limits and events off"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-failed-login-event"
      description: "Confirms events are on and a LOGIN_ERROR event with user_disabled for bob exists"
      type: "file"
      source: "validation/validate-failed-login-event.sh"
    - name: "validate-tokens"
      description: "Confirms alice and bob both get access tokens"
      type: "file"
      source: "validation/validate-tokens.sh"
    - name: "validate-login-options"
      description: "Confirms Forgot Password and remember me are on"
      type: "file"
      source: "validation/validate-login-options.sh"
    - name: "validate-limits"
      description: "Confirms the SSO idle limit and the access token lifespan"
      type: "file"
      source: "validation/validate-limits.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
