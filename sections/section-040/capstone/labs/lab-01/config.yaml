# Fix A Federation That Lost Its Users
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-089-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, OpenLDAP and the tester pod, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-089-capstone-040-setup"
      description: "Creates the LDAP provider openldap with a wrong bind credential and a wrong users DN, and no group mapper"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-ldap-tokens"
      description: "Confirms ldap-ana and ldap-ben get tokens with their LDAP password"
      type: "file"
      source: "validation/validate-ldap-tokens.sh"
    - name: "validate-group-sync"
      description: "Confirms the LDAP group warehouse is in Keycloak with ldap-ana as its only LDAP member"
      type: "file"
      source: "validation/validate-group-sync.sh"
    - name: "validate-provider-kept"
      description: "Confirms openldap is the original provider, still READ_ONLY, now with ou=people"
      type: "file"
      source: "validation/validate-provider-kept.sh"
    - name: "validate-group-mapper"
      description: "Confirms openldap has a group-ldap-mapper for ou=groups"
      type: "file"
      source: "validation/validate-group-mapper.sh"

teardown:
  keepCluster: false
