# Federate Users From An LDAP Directory (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-089-playground-040-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Deploy Keycloak 26.8.1, OpenLDAP with two people and one group, and the tester pod, then create the inventory realm, alice and inventory-cli."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads (namespace ldap-demo, keycloak-admin Secret, keycloak Deployment and Service, OpenLDAP with its seed ConfigMap, tester client)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
