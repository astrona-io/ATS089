# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats089-040
course_id: ATS089
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "User Federation And Identity Brokering"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats089-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Read a distinguished name"
    source_readings:
      - sections/section-040/module-01/course-01-ldap-federation-and-the-user-storage-spi.md
    prompt: "How is the DN `uid=ldap-ana,ou=people,dc=example,dc=org` written?"
    options:
      - id: a
        text: "From the top of the tree down to the entry."
        explanation: "Not correct. A DN starts at the entry, not at the top."
      - id: b
        text: "In alphabetical order of the attributes."
        explanation: "Not correct. The order follows the tree."
      - id: c
        text: "As the entry's attributes only, without the path."
        explanation: "Not correct. A DN is the full path of the entry."
      - id: d
        text: "From the entry up to the top of the tree."
        explanation: "Correct. The base DN `dc=example,dc=org` comes last."
    correct_option: d
    explanation: "Correct. The base DN `dc=example,dc=org` comes last."

  - id: ats089-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how Keycloak checks an LDAP password"
    source_readings:
      - sections/section-040/module-01/course-01-ldap-federation-and-the-user-storage-spi.md
    prompt: "How does Keycloak check the password of `ldap-ana` against OpenLDAP?"
    options:
      - id: a
        text: "It reads the `userPassword` attribute and compares it itself."
        explanation: "Not correct. Keycloak does not read the stored value."
      - id: b
        text: "It copies the password into its own database at the first sign-in."
        explanation: "Not correct. The password stays in LDAP."
      - id: c
        text: "It binds to the LDAP server as the user with the password she typed."
        explanation: "Correct. Keycloak never needs to read `userPassword`."
      - id: d
        text: "It asks the browser to send the password to the directory."
        explanation: "Not correct. The browser talks to Keycloak only."
    correct_option: c
    explanation: "Correct. Keycloak never needs to read `userPassword`."

  - id: ats089-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick a stable UUID attribute"
    source_readings:
      - sections/section-040/module-01/course-01-ldap-federation-and-the-user-storage-spi.md
    prompt: "Which attribute is a good UUID LDAP attribute in OpenLDAP?"
    options:
      - id: a
        text: "`uid`, because it is the username."
        explanation: "Not correct. A username can change, and the link would break."
      - id: b
        text: "`entryUUID`, because it never changes."
        explanation: "Correct. Keycloak links the local user to the entry through it."
      - id: c
        text: "`mail`, because it is unique."
        explanation: "Not correct. An email address can change."
      - id: d
        text: "`userPassword`, because only the user knows it."
        explanation: "Not correct. It changes when the password changes."
    correct_option: b
    explanation: "Correct. Keycloak links the local user to the entry through it."

  - id: ats089-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what Keycloak creates with a provider"
    source_readings:
      - sections/section-040/module-01/course-02-connecting-openldap.md
    prompt: "What does Keycloak add by itself when it creates an LDAP provider?"
    options:
      - id: a
        text: "Mappers that copy `uid`, `cn`, `sn` and `mail` to the username, first name, last name and email."
        explanation: "Correct. That is why a directory user arrives with a complete profile."
      - id: b
        text: "A copy of every LDAP user, at once."
        explanation: "Not correct. Users are copied at the first use or at a synchronization."
      - id: c
        text: "A group for each LDAP group."
        explanation: "Not correct. Groups need a group mapper."
      - id: d
        text: "A new LDAP administrator account."
        explanation: "Not correct. Keycloak does not change the directory."
    correct_option: a
    explanation: "Correct. That is why a directory user arrives with a complete profile."

  - id: ats089-040-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose an edit mode"
    source_readings:
      - sections/section-040/module-01/course-03-edit-modes-mappers-and-sync.md
    prompt: "The directory is the source of truth and other tools maintain it. Which edit mode fits?"
    options:
      - id: a
        text: "`WRITABLE`."
        explanation: "Not correct. That mode writes Keycloak's changes back to LDAP."
      - id: b
        text: "`UNSYNCED`."
        explanation: "Not correct. That mode stores changes in Keycloak only, so the two drift apart."
      - id: c
        text: "`IMPORT`."
        explanation: "Not correct. That is a sync mode of an identity provider, not an edit mode."
      - id: d
        text: "`READ_ONLY`."
        explanation: "Correct. Keycloak refuses changes to mapped attributes and the password."
    correct_option: d
    explanation: "Correct. Keycloak refuses changes to mapped attributes and the password."

  - id: ats089-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Configure a group mapper"
    source_readings:
      - sections/section-040/module-01/course-03-edit-modes-mappers-and-sync.md
    prompt: "The `member` attribute of the LDAP group holds full DNs. Which `membership.attribute.type` does the group mapper need?"
    options:
      - id: a
        text: "`UID`."
        explanation: "Not correct. That type is for members stored as plain user IDs."
      - id: b
        text: "`READ_ONLY`."
        explanation: "Not correct. That is an edit mode."
      - id: c
        text: "`DN`."
        explanation: "Correct. With `UID`, Keycloak would find no members."
      - id: d
        text: "`entryUUID`."
        explanation: "Not correct. That is a UUID attribute, not a membership type."
    correct_option: c
    explanation: "Correct. With `UID`, Keycloak would find no members."

  - id: ats089-040-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Contrast brokering and federation"
    source_readings:
      - sections/section-040/module-02/course-01-identity-brokering.md
    prompt: "What is the difference between identity brokering and user federation?"
    options:
      - id: a
        text: "Brokering stores passwords in LDAP. Federation stores them in Keycloak."
        explanation: "Not correct. Neither stores passwords that way."
      - id: b
        text: "With brokering the other provider checks the password. With federation Keycloak checks it against the directory."
        explanation: "Correct. The broker never sees the password."
      - id: c
        text: "Brokering works only for social providers."
        explanation: "Not correct. Any OpenID Connect or SAML provider can be brokered."
      - id: d
        text: "Federation works only with a browser."
        explanation: "Not correct. Federation also works with the password grant."
    correct_option: b
    explanation: "Correct. The broker never sees the password."

  - id: ats089-040-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the broker endpoint"
    source_readings:
      - sections/section-040/module-02/course-01-identity-brokering.md
    prompt: "What is the broker endpoint for an identity provider with the alias `partner` in the realm `inventory`?"
    options:
      - id: a
        text: "`/realms/inventory/broker/partner/endpoint`."
        explanation: "Correct. The alias is part of the path."
      - id: b
        text: "`/realms/partner/broker/inventory/endpoint`."
        explanation: "Not correct. The realm comes first and the alias second."
      - id: c
        text: "`/realms/inventory/protocol/openid-connect/auth`."
        explanation: "Not correct. That is the authorization endpoint of the realm."
      - id: d
        text: "`/realms/inventory/.well-known/openid-configuration`."
        explanation: "Not correct. That is the discovery document."
    correct_option: a
    explanation: "Correct. The alias is part of the path."

  - id: ats089-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what the external client needs"
    source_readings:
      - sections/section-040/module-02/course-02-adding-an-oidc-identity-provider.md
    prompt: "Which client does the broker need in the external realm `partner`?"
    options:
      - id: a
        text: "A public client with no secret."
        explanation: "Not correct. The code exchange needs a secret."
      - id: b
        text: "A bearer-only client with no redirect URI."
        explanation: "Not correct. The sign-in needs the redirect URI."
      - id: c
        text: "A client with the redirect URI `http://localhost:8080/`."
        explanation: "Not correct. The redirect URI must be the exact broker endpoint."
      - id: d
        text: "A confidential client with a client secret, whose redirect URI is the broker endpoint."
        explanation: "Correct. The broker exchanges the code with the secret."
    correct_option: d
    explanation: "Correct. The broker exchanges the code with the secret."

  - id: ats089-040-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Fix a mismatched issuer"
    source_readings:
      - sections/section-040/module-02/course-02-adding-an-oidc-identity-provider.md
    prompt: "Brokered sign-ins fail because the `issuer` setting differs from the `iss` claim of the partner's tokens. What is the right fix?"
    options:
      - id: a
        text: "Turn off signature validation."
        explanation: "Not correct. Keycloak would then accept any token that looks right."
      - id: b
        text: "Change `iss` in the partner's tokens by hand."
        explanation: "Not correct. The partner signs its tokens."
      - id: c
        text: "Use one address for every endpoint, so that `issuer` equals the `iss` claim."
        explanation: "Correct. In development mode the issuer follows the address of the request."
      - id: d
        text: "Change the sync mode to `FORCE`."
        explanation: "Not correct. The sync mode does not affect the issuer check."
    correct_option: c
    explanation: "Correct. In development mode the issuer follows the address of the request."
