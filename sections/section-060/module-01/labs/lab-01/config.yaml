# Create Organizations And Add Members
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-089-lab-060-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-089-lab-060-01-setup"
      description: "Creates the realm inventory, alice, bob and the client inventory-cli with organizations off"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-organizations"
      description: "Confirms organizations are on and acme and globex exist and are enabled"
      type: "file"
      source: "validation/validate-organizations.sh"
    - name: "validate-domains"
      description: "Confirms each organization has its own domain"
      type: "file"
      source: "validation/validate-domains.sh"
    - name: "validate-members"
      description: "Confirms alice is in acme only and bob is in globex only"
      type: "file"
      source: "validation/validate-members.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
