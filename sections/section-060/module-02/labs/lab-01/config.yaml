# Give A Help Desk Least-Privilege Access
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-089-lab-060-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-089-lab-060-02-setup"
      description: "Creates the realm inventory and the users helpdesk, auditor, alice and bob without administration roles"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-helpdesk"
      description: "Confirms helpdesk lists and manages users and cannot read events"
      type: "file"
      source: "validation/validate-helpdesk.sh"
    - name: "validate-auditor"
      description: "Confirms auditor reads events and users and cannot create users"
      type: "file"
      source: "validation/validate-auditor.sh"
    - name: "validate-no-realm-admin"
      description: "Confirms nobody holds realm-admin"
      type: "file"
      source: "validation/validate-no-realm-admin.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
