        tags: [ldap, user-federation, ldap-mappers, ldap-sync, edit-mode, password-grant]
        learning_goals:
          - Find why LDAP users cannot sign in from the provider's settings and a connection test
          - Fix the bind credential and the users DN, and add a group mapper, without deleting the provider
          - Prove that both LDAP users get tokens and the LDAP group shows up in Keycloak with its member
