        path: sections/section-030/module-01/course-03-webauthn-and-passkeys.md
      - type: reading
        title: Summary
        path: sections/section-030/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-030/capstone/labs/lab-01/question.md
      - type: lab
        title: "Require A Second Factor For Administrators Capstone"
        path: sections/section-030/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: authentication
        task_kind: troubleshooting
        tags: [authentication-flows, executions, conditional-otp, otp-policy, webauthn, passkeys]
        learning_goals:
          - Find why a conditional OTP step and passkey registration do not work from the flow and the required actions
          - Fix the flow, the required actions and the passwordless policy without unbinding the flow
          - Prove that ordinary users still sign in and the second-factor settings read back as required
        resources:
          - name: "Server Administration Guide: WebAuthn"
            url: https://www.keycloak.org/docs/latest/server_admin/index.html#webauthn_server_administration_guide
